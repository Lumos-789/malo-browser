<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Form</title>
    <style>
      body {
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 32px;
        color: #1f2933;
      }
      label,
      input,
      select,
      button {
        display: block;
        margin: 8px 0;
      }
      table {
        border-collapse: collapse;
        margin: 16px 0;
      }
      th,
      td {
        border: 1px solid #cbd2d9;
        padding: 6px 12px;
        text-align: left;
      }
      dialog {
        margin-top: 16px;
      }
      iframe {
        width: 240px;
        height: 80px;
        border: 1px solid #cbd2d9;
      }
    </style>
  </head>
  <body>
    <h1>Agent Form</h1>
    <label for="name">Name</label>
    <input id="name" name="name" placeholder="Your name" />
    <label for="status">Status</label>
    <select id="status" name="status">
      <option value="open">Open</option>
      <option value="closed">Closed</option>
    </select>
    <button id="submit" type="button">Submit</button>
    <button id="hover" type="button">Hover me</button>
    <table>
      <thead>
        <tr>
          <th>Key</th>
          <th>Value</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>alpha</td>
          <td>1</td>
        </tr>
      </tbody>
    </table>
    <div id="status-message" role="alert">Ready</div>
    <dialog open>
      <p>Confirm this action</p>
      <button id="confirm" type="button">OK</button>
    </dialog>
    <iframe title="child frame" srcdoc="<p>frame child</p>"></iframe>
    <script>
      const hover = document.getElementById("hover");
      hover.addEventListener("mouseover", () => {
        hover.textContent = "Hovered";
      });
      hover.addEventListener("mouseout", () => {
        hover.textContent = "Hover me";
      });
      document.getElementById("submit").addEventListener("click", () => {
        document.getElementById("status-message").textContent = "Submitted";
      });
    </script>
  </body>
</html>
