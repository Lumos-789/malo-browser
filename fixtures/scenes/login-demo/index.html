<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Login</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #eef2f5;
        color: #17212b;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(420px, calc(100vw - 48px));
        padding: 32px;
        border: 1px solid #c7d0d8;
        border-radius: 8px;
        background: #fff;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 24px; color: #52606d; }
      label { display: grid; gap: 8px; margin-top: 16px; font-weight: 600; }
      input {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #9aa7b2;
        border-radius: 4px;
        font: inherit;
      }
      button {
        width: 100%;
        height: 44px;
        margin-top: 24px;
        border: 0;
        border-radius: 4px;
        background: #0b6bcb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #signed-in {
        display: grid;
        gap: 12px;
      }
      #signed-in[hidden], #login[hidden] { display: none; }
      #signed-in strong { font-size: 22px; }
      #status { color: #1f7a4d; }
    </style>
  </head>
  <body>
    <main>
      <form id="login">
        <h1>Sign in</h1>
        <p>Use the configured demo account.</p>
        <label>Email <input name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
      </form>
      <section id="signed-in" hidden>
        <h1>Workspace</h1>
        <strong id="welcome"></strong>
        <div id="status">Signed in successfully</div>
      </section>
    </main>
    <script>
      const form = document.querySelector("#login");
      const signedIn = document.querySelector("#signed-in");
      const welcome = document.querySelector("#welcome");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const email = String(data.get("email") || "").trim();
        const password = String(data.get("password") || "");
        if (!email || !password) return;
        welcome.textContent = `Signed in as ${email}`;
        form.hidden = true;
        signedIn.hidden = false;
      });
    </script>
  </body>
</html>
