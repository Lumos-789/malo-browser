<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>信审复核台</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; color: #1c2430; background: #f4f6f8; }
      .page { display: flex; flex-direction: column; height: 100%; }
      .topbar { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 32px; background: #fff; border-bottom: 1px solid #e3e7ec; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; }
      .mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #2563eb, #0ea5a4); }
      .env { font-size: 12px; color: #b45309; background: #fef3c7; border-radius: 4px; padding: 2px 8px; }
      .clock { font-variant-numeric: tabular-nums; color: #5b6572; }
      .content { flex: 1; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 24px; }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .metrics article { background: #fff; border: 1px solid #e3e7ec; border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
      .metrics h3 { margin: 0; font-size: 13px; font-weight: 500; color: #5b6572; }
      .metrics strong { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .metrics .warn { color: #b42318; }
      .metrics span { font-size: 12px; color: #8a949f; }
      .panel { flex: 1; background: #fff; border: 1px solid #e3e7ec; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
      .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef1f4; }
      .panel-head h2 { margin: 0; font-size: 15px; }
      .tools { display: flex; gap: 10px; }
      input { width: 220px; height: 34px; padding: 0 12px; border: 1px solid #d5dbe2; border-radius: 6px; font-size: 13px; outline: none; }
      input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
      button { height: 34px; padding: 0 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-weight: 500; color: #5b6572; padding: 12px 20px; background: #fafbfc; border-bottom: 1px solid #eef1f4; }
      td { padding: 14px 20px; border-bottom: 1px solid #f2f4f7; }
      tr.risk td { background: #fff7f5; }
      .mono { font-family: "SF Mono", Menlo, monospace; }
      .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #eef2f7; color: #344054; font-size: 12px; }
      .tag-risk { background: #fee4e2; color: #b42318; }
      .bar { margin-top: auto; height: 4px; background: #2563eb; width: 36%; animation: sweep 6s linear infinite; }
      @keyframes sweep { 0% { transform: translateX(0); } 50% { transform: translateX(180%); } 100% { transform: translateX(0); } }
    </style>
  </head>
  <body>
    <div class="page" id="page" data-demo-state="loading">
      <header class="topbar">
        <div class="brand"><span class="mark"></span><span>信审复核台</span><span class="env">演示环境</span></div>
        <div class="clock" id="clock">--:--:--</div>
      </header>
      <main class="content">
        <section class="metrics">
          <article><h3>待复核</h3><strong>18</strong><span>较昨日 +4</span></article>
          <article><h3>风险命中</h3><strong class="warn">3</strong><span>需人工介入</span></article>
          <article><h3>今日完成</h3><strong data-demo-id="review-count">0</strong><span>本次演示标记</span></article>
          <article><h3>平均处理时长</h3><strong>2m 14s</strong><span>近 30 天</span></article>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>订单队列</h2>
            <div class="tools">
              <input data-demo-id="search" placeholder="搜索订单或状态" aria-label="搜索订单" />
              <button data-demo-id="increment" type="button">标记已复核</button>
            </div>
          </div>
          <table>
            <thead><tr><th>订单号</th><th>名称</th><th>区域</th><th>金额</th><th>状态</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="bar"></div>
        </section>
      </main>
    </div>
    <script>
      const orders = [
        { id: 1, code: "SO-2026-1041", name: "华东渠道首批铺货", region: "上海", amount: "¥182,400", status: "已发货", risk: false },
        { id: 2, code: "SO-2026-1042", name: "华南渠道补单", region: "广州", amount: "¥96,800", status: "待复核", risk: false },
        { id: 3, code: "SO-2026-1043", name: "风险订单 · 金额异常", region: "深圳", amount: "¥1,204,000", status: "挂起", risk: true },
        { id: 4, code: "SO-2026-1044", name: "西北渠道常规订单", region: "西安", amount: "¥64,200", status: "已复核", risk: false }
      ];
      const rows = document.getElementById("rows");
      const search = document.querySelector("[data-demo-id='search']");
      const countEl = document.querySelector("[data-demo-id='review-count']");
      const clock = document.getElementById("clock");
      let count = 0;
      let keyword = "";

      function render() {
        rows.innerHTML = orders
          .filter((o) => !keyword || o.name.includes(keyword) || o.status.includes(keyword) || o.code.includes(keyword))
          .map((o) => `
            <tr data-demo-id="row-${o.id}" class="${o.risk ? "risk" : ""}">
              <td class="mono">${o.code}</td>
              <td>${o.name}</td>
              <td>${o.region}</td>
              <td class="mono">${o.amount}</td>
              <td><span class="tag ${o.risk ? "tag-risk" : ""}">${o.status}</span></td>
            </tr>`)
          .join("");
      }

      document.querySelector("[data-demo-id='increment']").addEventListener("click", () => {
        count += 1;
        countEl.textContent = String(count);
      });
      search.addEventListener("input", (event) => {
        keyword = event.target.value.trim();
        render();
      });
      setInterval(() => {
        clock.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }, 500);

      render();
      document.getElementById("page").dataset.demoState = "ready";
    </script>
  </body>
</html>
